services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://app:app@db:5432/banking_assistant
      CHROMA_PERSIST_DIR: /data/chroma_db
    volumes:
      - chroma_data:/data/chroma_db
      - reports_data:/app/reports
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "8501:8501"
    environment:
      API_BASE_URL: http://api:8000
    depends_on:
      - api

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: banking_assistant
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d banking_assistant"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  chroma_data:
  reports_data:
